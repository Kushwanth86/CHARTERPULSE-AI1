name: QA regressions

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements.txt pytest coverage
      - name: Run backend tests
        run: pytest -q
      - name: Audit tanker source transcription against saved HTML
        run: python scripts/data/audit_tanker_source_integrity.py
      - name: Run tanker regression tests with branch coverage
        run: coverage run --branch --source=validate_tanker_candidates -m pytest -q scripts/data/test_normalize_tanker_report.py
      - name: Enforce tanker validator coverage floor
        run: coverage report --show-missing --fail-under=70

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run frontend regression tests
        working-directory: apps/web
        run: npx --yes tsx --test tests/regressions.test.ts
      - name: Run production build
        working-directory: apps/web
        run: npm run build
